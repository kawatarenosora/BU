plugins { id 'java' }

// BU mod jar for the ZombieBuddy edition: no ByteBuddy, no shading, no
// premain. ZombieBuddy loads the jar (mod.info: javaJarFile + javaPkgName=bu)
// and publishes bu.BUControl to Lua; bu.Main is the redundant trigger and
// the only Java code that touches ZB APIs (via reflection only).
//
// The default revision is a display tag only (the bridge is game
// version-independent). Override if needed: gradle build -PbuRev=<tag>
def buRev = findProperty('buRev') ?: 'unversioned'

// Compile-only dependency: ZombieBuddy's API jar (the mod requires
// ZombieBuddy at runtime, so ZB always provides these classes). Resolved
// from a subscribed Workshop item by default; override with
// -PzbJar=<path-to-ZombieBuddy.jar>.
//   item 3812624292 = ZombieBuddy BETA (3.x),   item 3619862853 = stable (2.x)
def zbJar = findProperty('zbJar')
if (!zbJar) {
    def roots = ['C:\\Program Files (x86)\\Steam', 'E:\\Program Files (x86)\\Steam']
    def steamLib = System.getenv('STEAM_LIBRARY')
    if (steamLib) { roots.add(0, steamLib) }
    for (root in roots) {
        for (id in ['3812624292', '3619862853']) {
            def f = new File(root, "steamapps\\workshop\\content\\108600\\${id}\\mods\\ZombieBuddy\\libs\\ZombieBuddy.jar")
            if (f.isFile()) { zbJar = f.absolutePath; break }
        }
        if (zbJar) { break }
    }
}
if (!zbJar) {
    throw new GradleException("ZombieBuddy.jar not found for compileOnly. Subscribe to the ZombieBuddy Workshop item and retry, or pass -PzbJar=<path-to-ZombieBuddy.jar>.")
}
println "[BU] compiling against ZombieBuddy API: ${zbJar}"

dependencies {
    compileOnly files(zbJar)
}

sourceSets {
    main {
        java { srcDirs = ['src/main/java'] }
        resources { srcDirs = ['src/main/resources'] }
    }
}

processResources {
    filesMatching('bu/build-info.properties') {
        expand(revision: buRev)
    }
}

compileJava {
    sourceCompatibility = 25
    targetCompatibility = 25
    options.encoding = 'UTF-8'
}

// Shipped artifact is the plain mod jar, written directly into the mod's
// media/java/ folder (see mod.info javaJarFile). Build with: gradle jar
jar {
    destinationDirectory = file('../42/media/java')
    archiveBaseName.set('bu-zb')
    archiveClassifier.set('')
    archiveVersion.set('')
}
